const objects = Object.keys(D.objects).sort();
const tableOf = (o) => D.objects[o].table;

function nav() {
  const r = location.hash.slice(2);
  const item = (href, label, n) => `<a href="#/${href}" class="${r === href || r.startsWith(href + "/") ? "on" : ""}">${esc(label)}${n === undefined ? "" : `<span>${n}</span>`}</a>`;

  h += `<input id="q" placeholder="Search every row" value="${esc(query)}">`;
  h += item("overview", "Overview");
  h += `<div class="group">Domain objects</div>`;
  for (const o of objects) { const t = tableOf(o); h += item(`object/${o}`, o, t ? t.records.length : Object.keys(D.objects[o].shapes).length); }

  h += item("journeys", "Journeys", D.journeys.length) + item("failures", "Failures", D.failures.length) + item("calls", "All calls", D.calls.length);
  $("#nav").innerHTML = h;
  $("#q").oninput = (e) => { query = e.target.value.toLowerCase(); render(); };
}

function cell(k, v, links) {
  if (v === null || v === undefined) return `<td class="null">null</td>`;
  if (links && links[k]) return `<td><a class="link" href="#/ref/${esc(links[k])}">→ ${esc(links[k])}</a></td>`;
  if (typeof v === "object") return `<td>${esc(JSON.stringify(v))}</td>`;
  return `<td>${esc(v)}</td>`;
}

  const shown = list.filter((i) => !query || JSON.stringify(i).toLowerCase().includes(query));
  const target = decodeURIComponent((location.hash.match(/#\/ref\/(.+)/) || [])[1] || "");
  let h = `<div class="meta" style="margin-bottom:6px">${shown.length} of ${list.length} · <span class="toggle" id="aud">${showAudit ? "hide" : "show"} audit columns</span></div>`;
  h += `<div class="wrap"><table><tr><th>ref</th>${extra ? extra.map((e) => `<th>${e[0]}</th>`).join("") : ""}${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
  for (const i of shown) {
    h += `<tr id="r-${esc(i.ref)}" class="${i.ref === target ? "hit" : ""}"><td class="ref">${esc(i.ref)}</td>`;
    if (extra) h += extra.map((e) => `<td>${esc(e[1](i) ?? "")}</td>`).join("");
    h += cols.map((c) => cell(c, (i.data || {})[c], i.links)).join("") + "</tr>";
  }
  return h + "</table></div>";
}

function overview() {
  const ix = D.index, rec = ix.reconciled;
  let h = `<h2>${esc(ix.domain || ix.repository)}</h2><p class="lead">${esc(ix.repository)} · coverage ${esc(ix.report.coverage || "")}</p>`;
  h += `<div class="grid">`;
  const stat = (n, l) => `<div class="stat"><b>${n}</b>${l}</div>`;
  h += stat(rec.rows, `rows <span class="${rec.matches_report ? "ok" : "bad"}">${rec.matches_report ? "= report" : "≠ report " + ix.report.rows}</span>`);
  h += stat(objects.length, "domain objects") + stat(ix.calls, "calls") + stat(ix.journeys, "journeys") + stat(ix.failures, "failures") + `</div>`;
  h += `<h3 style="margin-top:22px">Domain objects</h3><div class="wrap"><table><tr><th>object</th><th>records</th><th>cases</th><th>rejections</th><th>calls</th><th>events</th><th>shapes</th></tr>`;
  for (const o of ix.objects) h += `<tr><td><a class="link" href="#/object/${esc(o.object)}">${esc(o.object)}</a></td><td>${o.records}</td><td>${o.cases}</td><td>${o.rejections}</td><td>${o.calls}</td><td>${o.events}</td><td>${o.shapes.length}</td></tr>`;
  h += `</table></div><p class="meta" style="margin-top:14px">Personal data: ${esc(ix.personal)}.</p>`;
  return h;
}

function objectView(o, tab) {
  const ob = D.objects[o], t = ob.table, calls = callsOf(o), events = eventsOf(o);
  const shapes = Object.keys(ob.shapes);
  tab = tab || (t ? "records" : "shapes");
  const tabs = [["records", t ? t.records.length : 0], ["cases", t ? t.cases.length : 0], ["rejections", t ? t.rejections.length : 0], ["calls", calls.length], ["events", events.length], ["shapes", shapes.length]];
  let h = `<h2>${esc(o)}</h2><p class="lead">${t ? `Table <code>${esc(t.entity)}</code> · <span class="mono">${esc(t.source || "")}</span>` : "No table of its own: its shapes are below."}</p>`;
  h += `<div class="tabs">${tabs.map(([k, n]) => `<a href="#/object/${o}/${k}" class="${k === tab ? "on" : ""}">${k}<span>${n}</span></a>`).join("")}</div>`;
  if (tab === "records") h += `<p class="meta">Realistic rows a tester loads. Every reference points at a record that exists.</p>` + rows(t ? t.records : []);
  if (tab === "cases") h += `<p class="meta">Every combination the coverage guarantee requires, with structural values.</p>` + rows(t ? t.cases : [], [["case", (i) => i.case]]);
  if (tab === "rejections") h += `<p class="meta">Inputs the code must refuse — one broken rule each.</p>` + rows(t ? t.rejections : [], [["field", (i) => i.violates.field], ["rule", (i) => i.violates.rule]]);
  if (tab === "calls") h += calls.map(callCard).join("") || `<p class="meta">None.</p>`;
  if (tab === "events") h += events.map((e) => `<div class="card"><h3>${esc(e.event)}</h3><div class="meta">consumed by ${esc(e.consumedBy.join(", ") || "nothing in this project")}</div>${rows(e.payload)}</div>`).join("") || `<p class="meta">None.</p>`;
  if (tab === "shapes") h += shapes.map((s) => { const m = ob.shapes[s]; return `<div class="card"><h3>${esc(s)} <span class="pill">${esc(m.role)}</span></h3><div class="meta mono">${esc(m.source || "")}</div>${rows(m.records.slice(0, 8))}<div class="meta">${m.records.length} records · ${m.cases.length} cases · ${m.rejections.length} rejections</div></div>`; }).join("");
  return h;
}

function callsOf(o) { return D.calls.filter((c) => c.object === o); }
function eventsOf(o) { return (D.objects[o].eventsOut || []); }

function statusPill(s) { return `<span class="pill s${String(s)[0]}">${s}</span>`; }
function callCard(c) {
  let h = `<div class="card"><h3>${esc(c.operation)}</h3><div class="meta mono">${esc(c.file)}${c.request ? " · request " + esc(c.request) : ""}${c.response ? " · response " + esc(c.response) : ""}</div>`;
  if (c.requestFields && c.requestFields.length) h += `<div class="meta">fields: ${esc(c.requestFields.join(", "))}</div>`;
  if (c.valid && c.valid.length) h += `<p class="meta" style="margin:10px 0 4px">Valid requests</p>` + c.valid.slice(0, 3).map((v) => `<pre>${esc(JSON.stringify(v.body || v.params, null, 2))}</pre>`).join("");
  if (c.rejections && c.rejections.length) {
    h += `<p class="meta" style="margin:10px 0 4px">Rejected requests</p><div class="wrap"><table><tr><th>field</th><th>rule</th><th>expect</th><th>why</th></tr>`;
    h += c.rejections.map((r) => `<tr><td>${esc(r.violates.field)}</td><td>${esc(r.violates.rule)}</td><td>${statusPill(r.expect.status)}</td><td>${esc(r.expect.why)}</td></tr>`).join("") + `</table></div>`;
  }
  return h + `</div>`;
}

function journeys(id) {
  if (!id) return `<h2>Journeys</h2><p class="lead">Test flows, step by step: from the repository's own tests, from the staged scenarios, and across services.</p>` +
    D.journeys.filter((j) => !query || JSON.stringify(j).toLowerCase().includes(query)).map((j) => `<div class="card"><h3><a class="link" href="#/journeys/${esc(j.id)}">${esc(j.title)}</a> <span class="pill">${esc(j.source)}</span></h3><div class="meta">${(j.steps || []).length} steps${j.crosses ? " · crosses " + esc(j.crosses.join(", ")) : ""}</div></div>`).join("");
  const j = D.journeys.find((x) => x.id === id);
  let h = `<h2>${esc(j.title)}</h2><p class="lead">${esc(j.source)}${j.file ? ` · <span class="mono">${esc(j.file)}</span>` : ""}${j.why ? " — " + esc(j.why) : ""}</p>`;
  if (j.setup && j.setup.length) h += `<h3>Setup</h3><ul>${j.setup.map((s) => `<li>${s.repo ? esc(s.repo) + " · " : ""}${s.table ? esc(s.table) + " " : ""}<span class="mono">${esc(s.ref)}</span>${s.what ? " — " + esc(s.what) : ""}${s.values ? `<pre>${esc(JSON.stringify(s.values, null, 2))}</pre>` : ""}</li>`).join("")}</ul>`;
  h += `<h3>Steps</h3><ol class="steps">${(j.steps || []).map((s) => `<li>${s.repo ? `<b>${esc(s.repo)}</b> · ` : ""}${esc(s.call || s.event || s.does || "")}${s.handled ? " — " + esc(s.handled) : ""}${s.body ? `<pre>${esc(JSON.stringify(s.body, null, 2))}</pre>` : ""}</li>`).join("")}</ol>`;
  h += `<h3>Expect</h3><ul>${(j.expect || []).map((e) => `<li class="mono">${esc(e)}</li>`).join("")}</ul>`;
  return h;
}

function failures(id) {
  if (!id) {
    const groups = {};
    for (const f of D.failures) (groups[f.kind] = groups[f.kind] || []).push(f);
    return `<h2>Failures</h2><p class="lead">Error replication: each exception the code throws, where, the call that triggers it, and the status the API answers.</p>` +
      Object.entries(groups).map(([k, fs]) => `<h3>${esc(k)} <span class="meta">${fs.length}</span></h3><div class="wrap"><table><tr><th>exception</th><th>thrown at</th><th>expect</th><th>trigger</th></tr>${fs.filter((f) => !query || JSON.stringify(f).toLowerCase().includes(query)).map((f) => `<tr><td><a class="link" href="#/failures/${esc(f.id)}">${esc(f.exception)}</a></td><td>${esc(f.thrownAt)}</td><td>${statusPill(f.expect.status)}</td><td>${esc(f.trigger ? f.trigger.call : "—")}</td></tr>`).join("")}</table></div>`).join("");
  }
  const f = D.failures.find((x) => x.id === id);
  let h = `<h2>${esc(f.title)}</h2><p class="lead"><code>${esc(f.exception)}</code> : ${esc(f.base)} · ${statusPill(f.expect.status)}</p>`;
  h += `<h3>Where</h3><pre>${esc(f.thrownAt)}\n${esc(f.condition || "")}\n    throw new ${esc(f.exception)}(…)</pre>`;
  if (f.trigger) h += `<h3>Trigger</h3><p class="mono">${esc(f.trigger.call)}${f.trigger.repeat ? " × " + f.trigger.repeat : ""}</p>${f.trigger.why ? `<p class="meta">${esc(f.trigger.why)}</p>` : ""}<pre>${esc(JSON.stringify(f.trigger.body || f.trigger.params, null, 2))}</pre>`;
  h += `<h3>Expect</h3><p>${statusPill(f.expect.status)} <code>${esc(f.expect.error)}</code></p>${f.expect.note ? `<p class="meta">${esc(f.expect.note)}</p>` : ""}`;
  return h;
}

function render() {
  const parts = location.hash.slice(2).split("/").map(decodeURIComponent);
  let h;
  if (parts[0] === "object" && D.objects[parts[1]]) h = objectView(parts[1], parts[2]);
  else if (parts[0] === "ref") { const r = D.refs[parts[1]]; if (r) { location.replace(`#/object/${r.object}/${refTab(r, parts[1])}`); setTimeout(() => { const el = document.getElementById("r-" + parts[1]); if (el) { el.classList.add("hit"); el.scrollIntoView({block:"center"}); } }, 30); return; } h = overview(); }
  else if (parts[0] === "journeys") h = journeys(parts[1]);
  else if (parts[0] === "failures") h = failures(parts[1]);
  else if (parts[0] === "calls") h = `<h2>All calls</h2>` + D.calls.map(callCard).join("");
  else h = overview();
  nav();
  $("#main").innerHTML = h;
  const a = $("#aud"); if (a) a.onclick = () => { showAudit = !showAudit; render(); };
}
function refTab(r, ref) { const t = D.objects[r.object].table; if (!t || t.entity !== r.entity) return "shapes"; return t.records.some((i) => i.ref === ref) ? "records" : t.cases.some((i) => i.ref === ref) ? "cases" : "rejections"; }
window.onhashchange = render;
if (!location.hash) location.hash = "#/overview"; else render();
</script>
</body>
</html>
